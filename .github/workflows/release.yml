# Push to main or dev → tests → tag → GHCR.
# main → :latest   dev → :dev

name: Release

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  ci:
    name: Checks
    uses: ./.github/workflows/ci.yml

  semantic_release:
    name: Semantic release
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        env:
          DOCKER_CLIENT_TIMEOUT: "180"
          COMPOSE_HTTP_TIMEOUT: "180"
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin && exit 0
            echo "GHCR login failed (attempt $i), retry in 15s"
            sleep 15
          done
          echo "GHCR login timed out after 5 attempts"
          exit 1

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: npx semantic-release

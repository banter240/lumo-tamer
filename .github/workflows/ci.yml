# Reusable + PR checks. No Home Assistant / HACS bits — this is a Node/Docker proxy.

name: CI

on:
  workflow_call:
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:ci

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: lumo-tamer:ci
          cache-from: type=gha,scope=lumo-tamer
          cache-to: type=gha,mode=max,scope=lumo-tamer
